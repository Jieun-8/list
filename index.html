<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>カードアルバム</title>
    <link rel="icon" type="image/png" href="./assets/images/icon.png" />
    <link rel="apple-touch-icon" href="./assets/images/icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="カードアルバム" />
    <meta name="theme-color" content="#f6b5ce" />
    <link rel="stylesheet" href="./assets/css/base.css?v=20261027-aipri-local-unlimited-qr-v2" />
    <script defer src="./assets/js/router.js?v=20261027-aipri-local-unlimited-qr-v2"></script>
      <script defer src="./assets/js/login-position.js?v=20261026-login-position-v1"></script>
  </head>
  <body>
    <template id="page-album" data-body-class="">
      <header>
        <a aria-label="カードアルバムのトップへ" class="wordmark" href="./">
          <img alt="" class="header-card" hidden="" id="header-card" />
          <span id="header-title">カードアルバム</span>
        </a>
        <a id="guest-browse-link" class="guest-browse-link" href="./?view=browse">ログインせずに利用</a>
        <button
          aria-controls="nav"
          aria-expanded="false"
          aria-label="メニューを開く"
          class="menu-toggle"
          hidden=""
          id="menu-toggle"
        >
          <span></span><span></span><span></span>
        </button>
        <nav aria-label="アルバムの操作" hidden="" id="nav">
          <div aria-label="作品を切り替える" class="game-switch" id="game-switch" role="group">
            <span aria-hidden="true" class="game-switch-slider"></span>
            <button aria-pressed="false" data-game="aipri">アイプリ</button>
          </div>
          <button hidden="" id="ownership-export-open" type="button"> 所持状況を共有 </button>
          <button hidden="" id="probability-open">確率確認</button>
          <button id="edit-nickname">ニックネームを変更</button>
          <button id="logout">ログアウト</button>
        </nav>
      </header>
      <main>
        <section class="auth" id="auth">
          <div class="intro">
            <h1>あなたのカードを<br />まとめて管理。</h1>
            <div aria-label="カードのスライド一覧" class="card-marquee" id="auth-art">
              <div class="marquee-track">
                <div class="marquee-group"></div>
                <div aria-hidden="true" class="marquee-group"></div>
              </div>
            </div>
          </div>

          <div class="auth-panel">
            <section id="maintenance-panel" class="maintenance-panel" hidden="" aria-live="polite">
              <span class="maintenance-symbol" aria-hidden="true">✦</span>
              <p class="maintenance-kicker">CARD ALBUM</p>
              <h2>メンテナンス中</h2>
              <p id="maintenance-message"
                >ただ今システムのメンテナンスをしていますので、アルバムを開けません。</p
              >
              <div class="maintenance-schedule"
                ><span>メンテナンス終了予定</span><strong id="maintenance-end">未定</strong></div
              >
              <p class="maintenance-wait"
                >流れてくるカードを眺めて、<br />今しばらくお待ちください。</p
              >
              <button class="text-button" id="maintenance-refresh" type="button"
                >状況を確認する</button
              >
              <p id="maintenance-check-message" role="status"></p>
            </section>
            <div id="auth-normal-panel">
              <h2>カードアルバムへようこそ</h2>
              <div class="tabs">
                <button class="active" id="login-tab">ログイン</button
                ><button id="signup-tab">新規登録</button>
              </div>
              <form id="auth-form" novalidate="">
                <label
                  ><span id="login-identifier-label">アルバムID</span
                  ><input
                    aria-describedby="email-error"
                    autocapitalize="characters"
                    autocomplete="username"
                    id="email"
                    maxlength="254"
                    placeholder="アルバムID"
                    required=""
                    spellcheck="false"
                    type="text" /><span
                    class="field-error"
                    hidden=""
                    id="email-error"
                    role="alert"
                  ></span
                ></label>
                <label
                  >パスワード<input
                    aria-describedby="password-error"
                    autocomplete="current-password"
                    id="password"
                    maxlength="128"
                    minlength="8"
                    required=""
                    type="password" /><span
                    class="field-error"
                    hidden=""
                    id="password-error"
                    role="alert"
                  ></span
                ></label>
                <button class="primary" id="auth-submit" type="submit"> ログイン </button>
                <p class="account-retention-note">
                  1か月間ログイン・利用がないアカウントは所持記録とともに自動削除します。削除されたIDは再利用できません。
                </p>
              </form>
              <div hidden="" id="signup-flow">
                <ol aria-label="登録の手順" class="signup-steps">
                  <li data-signup-marker="id">ID発行</li>
                  <li data-signup-marker="password">パスワード</li>
                  <li data-signup-marker="nickname">ニックネーム</li>
                </ol>
                <section id="signup-id-step">
                  <h3>あなたのアルバムID</h3>
                  <button class="primary" id="issue-album-id" type="button">
                    アルバムIDを発行
                  </button>
                  <div hidden="" id="issued-id-panel">
                    <div class="album-id-card">
                      <output id="issued-album-id"></output
                      ><button id="album-id-copy" type="button">コピー</button>
                    </div>
                    <p class="id-save-note">
                      ログインにはこのIDの入力が必要になります。スクショなどで保存してください。
                    </p>
                    <p class="muted id-expiry-note">
                      このままパスワード設定に進んでください。このページを離れると登録手続きを引き継げません。戻った際はIDを発行し直してください。
                    </p>
                  </div>
                  <button
                    class="primary"
                    disabled=""
                    hidden=""
                    id="signup-password-start"
                    type="button"
                  >
                    パスワードを設定
                  </button>
                </section>
                <form hidden="" id="signup-password-form" novalidate="">
                  <h3>パスワードを設定</h3>
                  <p class="signup-id-reference"></p>
                  <label
                    >パスワード<input
                      autocomplete="new-password"
                      id="signup-password"
                      maxlength="128"
                      minlength="8"
                      required=""
                      type="password"
                  /></label>
                  <label
                    >パスワード確認<input
                      autocomplete="new-password"
                      id="signup-password-confirm"
                      maxlength="128"
                      required=""
                      type="password"
                  /></label>
                  <p class="muted">8〜128文字で設定してください。</p>
                  <p class="field-error" hidden="" id="signup-password-error" role="alert"></p>
                  <div class="signup-actions">
                    <button id="signup-back-id" type="button">戻る</button
                    ><button class="primary" type="submit"> ニックネームを登録 </button>
                  </div>
                </form>
                <form hidden="" id="signup-nickname-form" novalidate="">
                  <h3>ニックネームを登録</h3>
                  <p class="signup-id-reference"></p>
                  <label id="nickname-field"
                    >ニックネーム<input
                      aria-describedby="nickname-error"
                      autocomplete="nickname"
                      id="nickname"
                      maxlength="16"
                      placeholder="アルバムに表示する名前"
                      type="text" /><span
                      class="field-error"
                      hidden=""
                      id="nickname-error"
                      role="alert"
                    ></span
                  ></label>
                  <p class="id-save-note">
                    氏名、住所、電話番号、メールアドレスなどの個人情報は禁止です。
                  </p>
                  <label class="nickname-ack"
                    ><input
                      id="nickname-privacy-ack"
                      type="checkbox"
                    />個人情報を含まないことを確認しました</label
                  >
                  <div class="signup-actions">
                    <button class="primary" id="album-create" type="submit">
                      アルバムを作成する
                    </button>
                  </div>
                </form>
                <p class="field-error" id="signup-message" role="status"></p>
              </div>
              <button class="text-button" hidden="" id="forgot"> パスワードを忘れた方</button
              ><button class="text-button" hidden="" id="resend"> 確認メールを再送する </button>
              <p id="auth-message" role="status"></p>
              <form hidden="" id="password-form">
                <label
                  >新しいパスワード<input
                    autocomplete="new-password"
                    id="new-password"
                    minlength="8"
                    required=""
                    type="password" /></label
                ><button class="primary">パスワードを変更</button>
              </form>
            </div>
          </div>
        </section>
        <section class="auth-result" hidden="" id="auth-result">
          <div class="auth-panel">
            <span aria-hidden="true" class="confirmation-icon" id="auth-result-icon">✓</span>
            <h1 id="auth-result-title">登録できました</h1>
            <output class="created-album-id" hidden="" id="auth-result-album-id"></output>
            <p id="auth-result-text" role="status"></p>
            <p class="account-retention-note" hidden="" id="auth-result-retention">
              <strong>パスワードを忘れた場合、再設定やアカウントの復旧はできません。</strong><br />
              アルバムIDとパスワードを、安全な場所に保存してください。<br /><br />
              1か月間ログイン・利用がないと、アカウントと所持記録を自動削除します。削除されたIDは再利用できません。
            </p>
            <button class="primary" id="auth-result-next">アルバムを選ぶ</button>
          </div>
        </section>
        <section hidden="" id="selection">
          <div class="selection-title">
            <span class="eyebrow">MY ALBUMS</span>
            <h1>どのアルバムを開く？</h1>
            <p id="account"></p>
            <p class="account-album-id" id="account-album-id"></p>
          </div>
          <div class="album-options">
            <button class="album aipri" data-game="aipri">
              <div class="album-images" id="aipri-art"
                ><img
                  src="https://aipri.jp/card/img/oa4/OA4-001_O.webp"
                  alt="スマイルハートバズリウムピンク（いのり）"
                  loading="eager"
                  decoding="async" /><img
                  src="https://aipri.jp/card/img/oa4/OA4-005_O.webp"
                  alt="スマイルハートバズリウムレッド（ナナ）"
                  loading="eager"
                  decoding="async"
              /></div>
              <span>アイプリ</span>
            </button>
          </div>
        </section>
        <section hidden="" id="collection">
          <div class="collection-title">
            <div>
              <span class="eyebrow">CARD COLLECTION</span>
              <h1 id="game-title">おねがいアイプリ</h1>
            </div>
            <span class="pill" id="total"></span>
          </div>
          <div
            aria-label="アイプリの種類"
            class="family-tabs"
            hidden=""
            id="aipri-families"
            role="group"
          >
            <button aria-pressed="true" class="active" data-family="おねがい">
              おねがいアイプリ</button
            ><button aria-pressed="false" data-family="ひみつ"> ひみつのアイプリ </button>
          </div>
          <div class="progress-card">
            <div><span>カードの取得率</span><strong id="percent">0%</strong></div>
            <div class="progress-track"><span id="progress-bar"></span></div>
            <div class="progress-bottom">
              <p id="progress-count"></p>
              <button
                aria-controls="series-progress"
                aria-expanded="false"
                aria-label="弾ごとの取得率を表示"
                class="text-button"
                id="progress-details"
              >
                <span aria-hidden="true" class="progress-chevron"></span>
              </button>
            </div>
            <div aria-live="polite" id="filtered-rate"></div>
          </div>
          <div class="series-progress" hidden="" id="series-progress"></div>
          <details class="filter-panel" id="filter-panel">
            <summary>カードを絞り込む <span id="filter-summary"></span></summary>
            <div class="filter-content">
              <label class="search-label"
                >フリーワード検索<input
                  id="query"
                  placeholder="カード名・コードなど"
                  type="search"
                /><button
                  aria-label="フリーワード検索を解除"
                  class="filter-clear"
                  id="clear-query"
                  type="button"
                >
                  解除
                </button></label
              >
              <div class="filter-grid" id="filters"></div>
              <div class="filter-footer">
                <button class="text-button" id="reset"> すべての絞り込みを解除 </button>
              </div>
            </div>
          </details>
          <div
            aria-label="適用中の絞り込み"
            aria-live="polite"
            class="active-filters"
            id="active-filters"
          ></div>
          <div class="ownership-toolbar">
            <div aria-label="所持状態" class="owned-tabs" role="group">
              <span aria-hidden="true" class="owned-tabs-slider"></span>
              <button class="active" data-owned="all">すべて</button
              ><button data-owned="yes">持っている</button
              ><button data-owned="no">持っていない</button>
            </div>
          </div>
          <div class="results-heading">
            <h2 id="result-count"></h2>
            <div class="results-controls card-display-toolbar">
              <label class="display-count">
                <span class="display-control-label">表示件数</span>
                <select aria-label="一覧の表示件数" id="page-size">
                  <option value="20">20枚</option>
                  <option value="50">50枚</option>
                  <option value="100">100枚</option>
                  <option value="all">すべて</option>
                </select>
              </label>
              <div aria-label="カード一覧の列数" class="mobile-column-control" role="group">
                <span class="mobile-column-label">カードの並び</span>
                <div class="mobile-column-buttons">
                  <button aria-pressed="false" data-card-columns="2" type="button"> 2列 </button>
                  <button aria-pressed="true" data-card-columns="3" type="button"> 3列 </button>
                </div>
              </div>
            </div>
          </div>
          <div class="card-grid" data-mobile-columns="3" id="cards"></div>
          <p hidden="" id="empty"> 見つかりませんでした。条件を変えて探してみてください。 </p>
          <div class="pagination">
            <button id="prev">前のページ</button>
            <nav aria-label="カード一覧のページ" id="page-numbers"></nav>
            <button id="next">次のページ</button>
          </div>
          <div aria-label="カード情報の更新状況" class="collection-status">
            <div class="sync-indicator" id="sync-indicator">
              <span aria-hidden="true" class="sync-spinner" hidden=""></span>
              <p class="muted" id="sync-status" role="status"></p>
            </div>
            <p class="notice" hidden="" id="data-warning"></p>
          </div>
        </section>
        <section class="probability-page" hidden="" id="probabilities">
          <div class="collection-title">
            <div>
              <span class="eyebrow">MY CARD STATS</span>
              <h1 id="probability-title">確率確認</h1>
            </div>
            <button type="button" hidden="" id="probability-back">アルバムに戻る</button>
          </div>
          <p class="muted">
            登録した所持枚数から計算した割合です。公式の排出確率ではありません。
          </p>
          <section class="probability-summary">
            <h2>シリーズ総合</h2>
            <p class="muted" id="probability-total"></p>
            <div class="probability-grid" id="probability-overall"></div>
            <p class="cost-box" hidden="" id="probability-overall-cost"></p>
          </section>
          <section class="probability-detail">
            <div class="probability-detail-heading">
              <h2>弾ごとの詳細</h2>
              <label
                ><span class="series-select-label">弾数</span
                ><select id="probability-series"></select
              ></label>
            </div>
            <p class="muted" id="probability-detail-total"></p>
            <div class="probability-grid" id="probability-detail-cards"></div>
            <p class="cost-box" hidden="" id="probability-detail-cost"></p>
          </section>
          <label class="cost-toggle"
            ><input id="show-cost" role="switch" type="checkbox" /><span
              aria-hidden="true"
              class="switch-track"
            ></span
            ><span>利用金額を表示 <small>1枚100円の目安</small></span></label
          >
        </section>
      </main>
      <footer>
        <p class="footer-note">
          非公式の個人用カード管理サイト · 画像・カード情報は各公式サイトに帰属します。
        </p>
        <div>
<a href="https://aipri.jp/card/oa4.html" rel="noopener" target="_blank">アイプリ公式</a>
        </div>
        <div class="footer-links">
          <a class="contact-footer-link" href="./contact/">お問い合わせ</a>
          <button data-info="terms">利用規約</button
          ><button data-info="privacy">プライバシーポリシー</button
          ><button data-info="about">このサイトについて</button>
        </div>
      </footer>
      <dialog aria-labelledby="info-title" id="info-dialog">
        <div class="modal-top">
          <h2 id="info-title"></h2>
          <button aria-label="閉じる" id="legal-close">×</button>
        </div>
        <div class="legal-body" id="info-body"></div>
      </dialog>
      <dialog aria-labelledby="nickname-heading" id="nickname-dialog">
        <form id="nickname-form">
          <div class="nickname-heading-row">
            <span class="eyebrow">MY ALBUM</span
            ><button aria-label="閉じる" id="nickname-top-close" type="button"> × </button>
          </div>
          <h2 id="nickname-heading">アルバムの名前</h2>
          <label
            >ニックネーム<input
              autocomplete="nickname"
              id="profile-nickname"
              maxlength="16"
              required=""
              type="text"
          /></label>
          <small class="nickname-help">2〜8文字。あとから変更できます。</small>
          <p id="nickname-message" role="status"></p>
          <div class="nickname-actions">
            <button id="nickname-cancel" type="button">閉じる</button
            ><button class="primary" id="nickname-save" type="submit"> 保存する </button>
          </div>
        </form>
      </dialog>
      <dialog id="detail">
        <div class="modal-top">
          <span id="modal-code"></span><button aria-label="閉じる" id="close">×</button>
        </div>
        <div class="modal-body">
          <div class="viewer">
            <div>
              <img alt="" id="modal-image" />
              <p hidden="" id="image-failure">画像を読み込めませんでした。</p>
              <span id="side-label"></span>
            </div>
          </div>
          <div class="modal-info">
            <span class="pill" id="modal-rarity"></span>
            <h2 id="modal-name"></h2>
            <dl id="modal-fields"></dl>
            <p class="muted" hidden="" id="metadata-note"></p>
            <button class="ownership-button" hidden="" id="modal-owned"></button>
            <div class="quantity-controls" hidden="" id="quantity-controls">
              <span>所持数</span>
              <div>
                <button aria-label="所持数を1枚減らす" id="quantity-minus" type="button"> −</button
                ><output aria-live="polite" id="quantity-value">1枚</output
                ><button aria-label="所持数を1枚増やす" id="quantity-plus" type="button">
                  ＋
                </button>
              </div>
            </div>
            <a id="modal-source" rel="noopener" target="_blank">公式カードリスト</a>
          </div>
        </div>
        <nav aria-label="カードの移動" class="detail-navigation">
          <button id="card-prev" type="button">← 前のカード</button
          ><button id="card-next" type="button">次のカード →</button>
        </nav>
      </dialog>
      <dialog aria-labelledby="logout-title" id="logout-dialog">
        <div class="modal-top">
          <h2 id="logout-title">ログアウトしますか？</h2>
          <button aria-label="閉じる" id="logout-close" type="button">×</button>
        </div>
        <p class="muted" id="logout-account"></p>
        <div id="logout-normal">
          <section aria-label="アルバムID" class="logout-identity">
            <span class="logout-identity-label">ALBUM ID</span>
            <div class="logout-id-row">
              <output aria-label="あなたのアルバムID" id="account-id-value"></output>
              <button aria-label="アルバムIDをコピー" id="account-id-copy" type="button">
                コピー
              </button>
            </div>
            <p>ログインに使うIDです。大切に保存してください。</p>
            <p id="account-id-message" role="status"></p>
          </section>
          <p>
            所持カードの記録は保存されています。またログインして続けられます。1か月間ログイン・利用がないと、アカウントと所持記録を自動削除します。削除されたIDは再利用できません。
          </p>
          <div class="account-actions">
            <button class="primary" id="logout-confirm">ログアウト</button>
          </div>
          <button class="account-delete-link" id="account-delete-open">
            アカウント情報を削除
          </button>
        </div>
        <div hidden="" id="account-delete-panel">
          <p>
            アカウント、ニックネーム、所持カード・所持数、読み取りメモを削除します。削除後は元に戻せません。削除されたアルバムIDは再利用できません。
          </p>
          <label
            >確認のため「削除」と入力してください<input
              autocomplete="off"
              id="account-delete-word"
              placeholder="削除"
          /></label>
          <div class="account-actions">
            <button id="account-delete-back">戻る</button
            ><button class="danger-button" disabled="" id="account-delete-confirm">
              アカウントを削除
            </button>
          </div>
        </div>
        <p id="account-action-message" role="status"></p>
      </dialog>
      <div hidden="" id="toast" role="status"></div>
      <dialog aria-labelledby="id-password-help-title" id="id-password-help">
        <div class="modal-top">
          <h2 id="id-password-help-title">パスワードを忘れた方へ</h2>
          <button aria-label="閉じる" id="id-password-help-close" type="button"> × </button>
        </div>
        <p>
          アルバムIDで作成したアカウントは、復旧用のメールアドレスを登録していないため、パスワードを再設定できません。
        </p>
        <p> ブラウザや端末のパスワード管理に、保存したパスワードがないかご確認ください。 </p>
        <p>
          アルバムIDだけでは本人確認ができません。パスワードが見つからない場合は、新しいアルバムを作成してください。以前の所持記録は引き継げません。
        </p>
      </dialog>
    </template>
    <template id="page-contact" data-body-class="">
      <header>
        <a class="wordmark" href="./">カードアルバム</a
        ><a class="back-link" href="./">アルバムへ戻る</a>
      </header>
      <main class="contact-main">
        <section class="contact-panel" id="contact-panel">
          <span class="eyebrow">CONTACT</span>
          <h1>お問い合わせ</h1>
          <p class="muted"> カード情報の修正やサイトに関するご相談をお送りください。 </p>
          <form id="contact-form">
            <div hidden="" id="contact-album-field">
              <label>アルバムID</label
              ><output class="created-album-id" id="contact-album-id"></output
              ><small>ログイン中のアルバムIDでお問い合わせを送信します。</small>
            </div>
            <label
              >メールアドレス<input
                autocomplete="email"
                id="contact-email"
                maxlength="254"
                required=""
                type="email"
              /><small>連絡を受け取れるアドレスを入力してください。</small></label
            ><label
              >お名前・ニックネーム <small>任意</small
              ><input autocomplete="name" id="contact-name" maxlength="40" type="text" /></label
            ><label
              >お問い合わせの種類<select id="contact-category">
<option value="question">使い方についての質問</option>
<option value="correction">カード情報の修正・追加依頼</option>
<option value="coordinate">コーデ情報の修正・追加依頼</option>
<option value="bug">不具合についての報告</option>
<option value="feature">機能追加依頼</option>
<option value="other">その他</option>
</select></label
            ><label
              >お問い合わせ内容<textarea
                id="contact-message"
                maxlength="3000"
                minlength="10"
                placeholder="対象のカードコードや、起きている状況などをご記入ください。"
                required=""
                rows="8"
              ></textarea
              ><small
                >10〜3,000文字。パスワードや確認メールのURLは記載しないでください。</small
              ></label
            ><label aria-hidden="true" class="contact-honeypot"
              >Website<input autocomplete="off" id="contact-website" tabindex="-1" /></label
            ><label class="consent"
              ><input id="contact-consent" required="" type="checkbox" /><span
                >プライバシーポリシーを確認し、入力内容の取り扱いに同意します。<button
                  class="text-button"
                  data-info="privacy"
                  type="button"
                >
                  内容を確認
                </button></span
              ></label
            >
            <p id="contact-error" role="status"></p>
            <button class="primary" id="contact-submit" type="submit"> 送信する </button>
          </form>
        </section>
        <section class="contact-panel" hidden="" id="contact-complete">
          <span aria-hidden="true" class="confirmation-icon">✓</span>
          <h1>送信しました</h1>
          <p>お問い合わせを受け付けました。</p>
          <p class="muted">受付番号</p>
          <p class="contact-reference" id="contact-reference"></p>
          <a class="contact-return" href="./">アルバムへ戻る</a>
        </section>
      </main>
      <footer>
        <div class="footer-links">
          <button data-info="terms">利用規約</button
          ><button data-info="privacy">プライバシーポリシー</button
          ><button data-info="about">このサイトについて</button>
        </div>
      </footer>
      <dialog aria-labelledby="info-title" id="info-dialog">
        <div class="modal-top">
          <h2 id="info-title"></h2>
          <button aria-label="閉じる" id="legal-close">×</button>
        </div>
        <div class="legal-body" id="info-body"></div>
      </dialog>
    </template>
    <template id="page-shared" data-body-class="public-share">
      <header class="public-header">
        <a id="public-owner" href="./">カードアルバム</a>
        <span class="public-readonly"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
            <circle cx="12" cy="12" r="3"></circle></svg
          >閲覧専用</span
        >
      </header>
      <main>
        <section id="public-unavailable" hidden=""
          ><h1>このアルバムは閲覧できません</h1><p>URLや公開設定をご確認ください。</p></section
        >
        <p id="public-status" role="status">所持状況を読み込み中…</p>
        <section id="public-album" hidden="">
          <div class="public-heading"
            ><h1 id="public-title">公開アルバム</h1
            ><button type="button" id="public-refresh" aria-label="所持状況を再読み込み"
              ><svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 8a8.5 8.5 0 1 0 .3 7M20 3v5h-5"></path></svg
              ><span>再読み込み</span></button
            ></div
          >
          <nav id="public-scopes" aria-label="公開中のアルバム"></nav
          ><aside id="public-scope-note" aria-label="表示中の公開範囲" hidden=""></aside>
          <div class="public-progress"
            ><span>総取得率</span><strong id="public-rate"></strong
            ><div class="public-progress-track"><span id="public-progress-bar"></span></div
            ><div class="public-progress-bottom"
              ><p id="public-count"></p
              ><details id="public-progress-details"
                ><summary aria-label="弾ごとの取得率を表示"
                  ><span aria-hidden="true"></span></summary
                ><div id="public-series-progress"></div></details></div
            ><div id="public-filtered-rate"></div
          ></div>
          <details class="public-filters"
            ><summary
              ><span id="public-filter-label">カードを絞り込む</span
              ><span id="public-filter-count"></span></summary
            ><div
              ><label
                >フリーワード検索<input
                  id="public-query"
                  type="search"
                  placeholder="名前・コードなど"
                  autocomplete="off" /></label
              ><div id="public-fields"></div
              ><button id="public-reset" type="button">すべての絞り込みを解除</button></div
            ></details
          >
          <div id="public-tags" class="active-filters" aria-label="適用中の絞り込み"></div>
          <div class="public-owned-wrap"
            ><div id="public-owned" class="owned-tabs" role="group" aria-label="所持状況"></div
          ></div>
          <div class="public-toolbar results-heading"
            ><h2 id="public-found"></h2
            ><div class="public-display-controls"
              ><label class="display-count"
                ><span class="display-control-label">表示件数</span
                ><select id="public-size"
                  ><option value="20">20枚</option
                  ><option value="50">50枚</option
                  ><option value="100">100枚</option
                  ><option value="all">すべて</option></select
                ></label
              ><div class="public-layout mobile-column-control" role="group" aria-label="一覧の並び"
                ><span id="public-layout-label" class="mobile-column-label">カードの並び</span
                ><div class="mobile-column-buttons"
                  ><button type="button" data-public-columns="2" aria-pressed="false">2列</button
                  ><button type="button" data-public-columns="3" aria-pressed="true"
                    >3列</button
                  ></div
                ></div
              ></div
            ></div
          >
          <div id="public-cards"></div>
          <p id="public-empty" hidden="">見つかりませんでした。条件を変えて探してみてください。</p>
          <nav id="public-pages" aria-label="ページ切り替え"></nav>
        </section> </main
      ><footer id="public-site-footer">
        <p class="footer-note"
          >非公式のカードアルバム共有画面 · 画像・カード情報は各権利者に帰属します。</p
        >
        <div>
<a href="https://aipri.jp/card/oa4.html" rel="noopener" target="_blank">アイプリ公式</a>
        </div>
        <div class="footer-links">
          <button data-share-info="terms" type="button">利用規約</button
          ><button data-share-info="privacy" type="button">プライバシーポリシー</button
          ><button data-share-info="about" type="button">このサイトについて</button>
        </div>
      </footer>
      <aside id="public-banner" class="public-signup-banner" aria-label="新規登録のご案内">
        <button type="button" id="public-banner-close" aria-label="新規登録の案内を閉じる"
          >×</button
        >
        <div class="public-banner-copy"
          ><span>MY CARD ALBUM</span><strong>あなたのカードも、ひとつのアルバムに。</strong
          ><p>集めたカードを記録して、コレクションを共有。</p></div
        >
        <div class="public-banner-marquee" aria-hidden="true"
          ><div id="public-banner-cards"></div
        ></div>
        <a href="./#signup">アルバムを作成する</a>
      </aside>
      <dialog id="public-detail"
        ><button type="button" id="public-close" aria-label="閉じる" tabindex="-1">×</button
        ><div id="public-detail-content"></div
      ></dialog>

      <dialog id="public-info-dialog" aria-labelledby="public-info-title"
        ><div class="modal-top"
          ><h2 id="public-info-title" tabindex="-1"></h2
          ><button type="button" id="public-info-close" aria-label="閉じる">×</button></div
        ><div class="legal-body" id="public-info-body"></div
      ></dialog>
    </template>
  </body>
</html>
